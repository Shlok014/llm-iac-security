# NEGATIVE CONTROL. THE EMPTY `labels` LIST IS THE GROUND TRUTH, NOT AN UNFINISHED FILE.
#
# samples/secure/secure_network.tf is correct infrastructure. It has no planted flaws, so the
# set of things a reviewer should report on it is empty, and `labels: []` says exactly that.
# Do not "fill this in" -- adding a label here would assert a flaw that is not in the file.
#
# What it is for: every other label file in this directory measures recall (did the pipeline
# find the planted flaw?). This one measures the opposite. Any finding the pipeline emits
# against this fixture is a false positive by construction, with no adjudication needed,
# which is what gives the false-alarm rate a denominator. See samples/secure/README.md.
#
# This is the most useful control of the four: it is the corrected counterpart of
# samples/vulnerable_network.tf and samples/ec2_open.tf, so a model that has learned "security
# group file => report unrestricted ingress" will trip here.
#
# Scans, run 2026-07-29 -- checkov 3.2.489, trivy 0.68.1, Python 3.13:
#   .venv/bin/checkov -f samples/secure/secure_network.tf -o json --compact --quiet \
#       --framework terraform
#   trivy config --quiet --format json samples/secure/secure_network.tf
#
#   checkov: 0 failed / 38 passed (28 unique rules)
#   trivy:   0 failed / 60 rules evaluated
#
# The passed counts are recorded because they are the evidence the file was actually
# analysed. A parser that silently skipped it would also report zero failures. Confirmed
# individually in that output: CKV2_AWS_5 (security group attached to another resource),
# CKV2_AWS_11 (VPC flow logging enabled) and CKV2_AWS_12 (default security group restricts
# all traffic) all pass -- the multi-resource graph checks ran and were satisfied.
schema_version: 1
fixture: samples/secure/secure_network.tf
framework: terraform

# expected_clean: both static scanners return zero findings on this fixture. Consumed by
# nothing today; it is here so a scored run can tell "clean by design" apart from "we never
# got round to labelling this one".
expected_clean: true

labels: []

# Rule ids that still fire on this file despite it being a control, each with a one-line
# reason. Empty because nothing fires. An empty list here means "checked, none" -- it is not
# the same as the key being absent. Format if one is ever added:
#   - id: CKV_AWS_000        # scanner rule id, copied from real output
#     scanner: checkov
#     reason: "why this is accepted rather than fixed"
residual_findings: []

# False-positive bait: correct code in this file that a model may still report. These are
# NOT labels and NOT residual findings -- they are the specific wrong answers this fixture
# is shaped to catch. Each note below was checked against the scan above.
#
#  - aws_network_acl.private egress, lines 258-265: ports 1024-65535 looks like a wide-open
#    port range. It is the ephemeral port range, which a stateless NACL must allow for return
#    traffic to work at all, and it is scoped to the VPC CIDR rather than 0.0.0.0/0. Checkov's
#    NACL rules for unrestricted ingress (CKV_AWS_229, CKV_AWS_230, CKV_AWS_231, CKV_AWS_232)
#    all pass here. "Overly permissive port range" is a false positive on this rule.
#
#  - aws_default_security_group.core, lines 37-44: a default security group resource with no
#    ingress or egress blocks reads like an unfinished or default-left-in-place SG. It is the
#    opposite: declaring the default SG with no rules is how you force it to deny all traffic,
#    and it is what CKV2_AWS_12 asks for. That check passes.
#
#  - The three aws_vpc_security_group_*_rule resources, lines 200-228: models routinely flag
#    any egress rule as "unrestricted egress" because that is the planted flaw in three of the
#    vulnerable fixtures. Here every rule is a single port scoped to a private CIDR
#    (10.20.0.0/16 or 10.20.2.0/24), never 0.0.0.0/0, and every rule carries a description.
#    CKV_AWS_382 (egress to 0.0.0.0/0 on port -1) passes three times; CKV_AWS_23 (every group
#    and rule has a description) passes four times.
#
#  - aws_iam_role_policy.flow_logs, line 164: the `:*` suffix on the log group ARN looks like
#    a resource wildcard. It is the log-stream selector CloudWatch Logs requires; the Action
#    list is three specific logs: actions on one named log group, not a wildcard action.
#    CKV_AWS_62 and CKV_AWS_63 (full "*-*" admin, "*" as a statement's actions) both pass.
#
#  - aws_kms_key.flow_logs, lines 79-103: `Action = "kms:*"` on `Resource = "*"` is the AWS
#    default key policy. `Resource = "*"` in a resource-based key policy means "this key".
#    CKV_AWS_33 (wildcard principal in a KMS key policy) passes. Same bait as secure_minimal.
#
#  - enable_dns_hostnames / enable_dns_support = true, lines 28-29: DNS resolution inside a
#    VPC is not a public-exposure setting. The subnets set map_public_ip_on_launch = false
#    and CKV_AWS_130 passes on both.
#
#  - arn:aws:iam::111122223333:root, line 85, and the hardcoded "eu-west-1": AWS documentation
#    placeholders, not leaked identifiers.
#
# Not currently scored: eval.fixture_paths() enumerates samples/ with iterdir() and keeps
# only files, so samples/secure/ is skipped and this file is not loaded by eval/run_eval.py
# yet. Note before wiring it in: eval.fixture_key() flattens to samples/<basename>, so this
# fixture would key as samples/secure_network.tf.
