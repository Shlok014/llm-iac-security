; Pytest configuration.
;
; Lives in pytest.ini rather than pyproject.toml so the test contract is readable on its
; own, and because a pytest.ini section must be spelled [pytest] — [tool.pytest.ini_options]
; is the pyproject spelling and is silently ignored here.
;
; The default run is hermetic: no subprocesses, no network, no OPENAI_API_KEY. Tests that
; shell out to the real checkov/trivy binaries are marked `slow` and deselected by default.
;
;   pytest              -> fast, hermetic suite
;   pytest -m slow      -> the real-binary end-to-end checks
;   pytest -m ""        -> everything

[pytest]
testpaths = tests
addopts = -ra --strict-markers --strict-config -m "not slow"
markers =
    slow: shells out to the real checkov/trivy binaries; deselected by default
