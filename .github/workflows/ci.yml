# Build and test. Runs on every push and pull request, including from forks.
#
# This workflow requires no secrets, and that is a property worth protecting: the whole
# package is designed so the parts that can be verified deterministically (scanners, gates,
# parsing, exit codes) are separable from the part that costs money and cannot be replayed
# (the model call). If a change ever makes this workflow need `OPENAI_API_KEY`, that
# separation has been broken, and the fix is in the code rather than here.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege, stated explicitly because the default `GITHUB_TOKEN` grant is much
# broader than this job needs. All it does is read the repository and run tests: it never
# pushes, never comments, never touches a release or a package. Anything that needs more
# than `contents: read` here is a change worth arguing about in review.
permissions:
  contents: read

# Supersede in-flight runs of the same ref instead of queueing them: pushing three times to
# a branch in a minute should cost one CI run, not three.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # ...but never cancel a run on `main`. A cancelled run leaves that commit with no status,
  # which is indistinguishable from a run that has not started, and `main` is the ref whose
  # history is meant to still be readable months from now.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: lint + tests (python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # `persist-credentials: false` keeps the GITHUB_TOKEN out of `.git/config`. This job
      # runs checkov and trivy rulesets over `samples/`, which is deliberately hostile
      # input, and it never pushes anything — so the token has no reason to be sitting on
      # disk where a subprocess could read it.
      #
      # checkout@v5 / setup-python@v6 are the first majors that run on Node 24. The v4/v5
      # pair still works, but every run carries a deprecation annotation, and a warning
      # triangle on a green run reads as "something is wrong here" to anyone skimming.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # 3.13 is the version every measured number in docs/ was produced on. `requires-python`
      # allows 3.11–3.13; the upper bound is real — checkov 3.2.489 crashes on 3.14.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # `[dev]` pulls in `[ui]` (see pyproject.toml). It has to: `tests/test_app_contract.py`
      # imports `app.py`, which imports streamlit and pandas. Without them that file fails to
      # collect, and the errors look like test failures without being any.
      - name: Install the package and its dev extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      # pytest.ini already carries `-m "not slow"` in addopts, so the default run is the
      # fast hermetic suite: no subprocesses, no network, no API key. The marker is repeated
      # here so the intent survives someone editing addopts.
      - name: pytest (fast, hermetic suite)
        env:
          OPENAI_API_KEY: "" # deliberately empty — the default suite must never need one
        run: pytest -m "not slow"

      - name: Console script is installed
        run: iac-agent version

      # The exit-code contract is the thesis of the project, so CI asserts it directly
      # rather than trusting that a unit test covers it. All three cases use the real
      # checkov binary that `pip install` just placed on PATH; none of them needs a key.
      - name: Exit-code contract (1 = findings, 0 = clean, 2 = could not look)
        run: |
          set -u
          fail() { echo "::error::$1"; exit 1; }

          iac-agent scan samples/s3_public.tf > /dev/null && code=0 || code=$?
          [ "$code" -eq 1 ] || fail "expected exit 1 (findings) from samples/s3_public.tf, got $code"

          # `samples/secure/secure_s3.tf` rather than a synthetic `variable "region" {}`. The
          # synthetic file exits 0 for the wrong reason: it declares no resources, so Checkov
          # evaluates *no policies at all* on it — proving "0 findings" but not "we looked".
          # A secure fixture passes dozens of real checks, so this asserts both halves of the
          # documented meaning of exit 0, which is "we looked, and it is clean".
          iac-agent scan samples/secure/secure_s3.tf > /dev/null && code=0 || code=$?
          [ "$code" -eq 0 ] || fail "expected exit 0 (clean) from samples/secure/secure_s3.tf, got $code"

          passed=$(iac-agent scan samples/secure/secure_s3.tf --json 2>/dev/null \
            | python -c 'import json,sys; print(sum(s["passed"] for t in json.load(sys.stdin)["targets"] for s in t["scans"]))')
          [ "$passed" -gt 0 ] || fail "exit 0 on secure_s3.tf but $passed checks were evaluated — that is 'we did not look', not 'it is clean'"

          # trivy is a Go binary and is deliberately not installed in this job, so this is a
          # genuine "the scanner could not run" case. It must be distinguishable from clean:
          # exit 2, never 0, even though the run reports zero findings.
          iac-agent scan samples/s3_public.tf --scanner trivy > /dev/null 2>&1 && code=0 || code=$?
          [ "$code" -eq 2 ] || fail "expected exit 2 (scanner unavailable), got $code — a scanner that could not run must never look like a clean result"

          # The second way to not-look: a file the scanner cannot parse. Checkov reports a
          # parsing error, evaluates nothing, and returns zero findings — which for a long
          # time exited 0 here. A half-written Terraform file must not pass a CI gate.
          printf 'resource "aws_s3_bucket" "b" {\n  bucket = "x"\n  policy = jsonencode({\n    Statement = [{\n' > "$RUNNER_TEMP/truncated.tf"
          iac-agent scan "$RUNNER_TEMP/truncated.tf" > /dev/null 2>&1 && code=0 || code=$?
          [ "$code" -eq 2 ] || fail "expected exit 2 (file did not parse), got $code — a file that was never examined must never look like a clean result"

          echo "exit-code contract holds: 1 / 0 / 2 (unavailable) / 2 (unparsed)"
